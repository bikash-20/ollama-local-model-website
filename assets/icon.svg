<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="50%" stop-color="#b98cff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Soft top glow -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Crescent moon (Nocta = 'of the night') -->
  <g transform="translate(256 256)">
    <!-- Moon body -->
    <circle cx="0" cy="-8" r="150" fill="#0f0f23" opacity="0.92"/>
    <!-- Cut the crescent with a slightly offset white-ish circle -->
    <circle cx="55" cy="-35" r="140" fill="url(#bg)"/>
    <!-- Subtle highlight on the moon -->
    <ellipse cx="-50" cy="-70" rx="40" ry="22" fill="#ffffff" opacity="0.18" filter="url(#soft)"/>
  </g>

  <!-- Tiny stars (sparkles around the moon) -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="120" cy="140" r="5"/>
    <circle cx="402" cy="178" r="4"/>
    <circle cx="380" cy="380" r="6"/>
    <circle cx="135" cy="370" r="4"/>
    <circle cx="92"  cy="252" r="3"/>
    <circle cx="420" cy="270" r="3"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <!-- 4-point sparkle shapes -->
    <path d="M105 95 L110 110 L125 115 L110 120 L105 135 L100 120 L85 115 L100 110 Z"/>
    <path d="M415 410 L419 421 L430 425 L419 429 L415 440 L411 429 L400 425 L411 421 Z"/>
  </g>
</svg>
